name: GuardDog
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  security-and-build:
    permissions:
      contents: read
      security-events: write
    name: Scan dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
      - name: Run GuardDog & Generate SARIF
        run: |
          uvx --python 3.12 guarddog pypi verify requirements.txt \
            --output-format sarif \
            --exclude-rules repository_integrity_mismatch > guarddog.sarif
      - name: Upload SARIF file to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          category: guarddog-builtin
          sarif_file: guarddog.sarif
      - name: Fail Job on Typosquatting or SARIF Findings
        run: |
          uv run --python 3.12 python - << 'EOF'
          import json, difflib, re, sys
          # 1. Prüfe, ob GuardDog im SARIF-Bericht Risiken gefunden hat
          with open("guarddog.sarif") as f:
              sarif = json.load(f)
          results = sarif.get("runs", [{}])[0].get("results", [])
          if results:
              print(f"[SECURITY ALERT] GuardDog found {len(results)} issue(s):")
              for r in results:
                  print(" -", r.get("message", {}).get("text"))
              sys.exit(1)
          # 2. Prüfe zusätzlich auf Typosquatting (auch falls das Tippfehler-Paket nicht auf PyPI existiert)
          POPULAR = ["requests", "urllib3", "numpy", "pandas", "flask", "django", "cryptography", "boto3"]
          with open("requirements.txt") as f:
              pkgs = [re.split(r"[=<>!~]", l.strip())[0].strip().lower() for l in f if l.strip() and not l.startswith(("#", "-"))]
          for pkg in pkgs:
              if pkg not in POPULAR:
                  close = difflib.get_close_matches(pkg, POPULAR, n=1, cutoff=0.75)
                  if close:
                      print(f"[SECURITY ALERT] Typosquatting detected: '{pkg}' is a look-alike of '{close[0]}'!")
                      sys.exit(1)
          print("Security check passed: 0 risks detected.")
          EOF