name: GuardDog

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-and-build:
    permissions:
      contents: read # for actions/checkout to fetch code
    name: Scan dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - run: uvx guarddog pypi verify requirements.txt --exclude-rules repository_integrity_mismatch